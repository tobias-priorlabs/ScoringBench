[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scoringbench"
version = "0.0.1"
description = "Scoring rules for probabilistic tabular regression"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<2.3",
    "scipy",
    "scikit-learn",
    "pandas",
    "torch",
    "openml",
    "pyarrow",
    "tqdm",
]

[project.optional-dependencies]
report = ["autorank"]
synthetic = ["pyvinecopulib>=0.6"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["scoringbench*"]
